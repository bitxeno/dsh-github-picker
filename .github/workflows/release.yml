name: release

# Release flow: the version is bumped in package.json + dsh.plugin.json by a
# `chore(release)` commit; any push touching those files re-runs the whole
# pipeline. Tests/build run locally before the bump (devDependencies are
# machine-local `link:` entries CI cannot install); the committed lib/ is what
# gets published. A manual run re-checks the current files without a push.
on:
  push:
    branches: [main]
    paths: ['package.json', 'dsh.plugin.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve the version to release
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./dsh.plugin.json').version")"
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::version mismatch: package.json is $VERSION but dsh.plugin.json is $PLUGIN_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The release notes come from changelogen (conventional commits since
      # the last tag; docs/ci commits are omitted via the package.json
      # `changelog.types` config). changelogen's own `## vX.Y.Z` heading and
      # compare link are stripped — `--generate-notes` already renders the
      # version title and the Full Changelog link. The run happens BEFORE the
      # tag exists so the from-range still ends at the last release tag.
      - name: Generate the release notes with changelogen
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npx --yes changelogen@0.6.2 -r "$VERSION" 2>/dev/null > "$RUNNER_TEMP/release-notes.md"
          # Keep from the first `###` section on, dropping the heading and
          # compare-changes preamble changelogen always emits.
          awk '/^### /{f=1} f' "$RUNNER_TEMP/release-notes.md" > "$RUNNER_TEMP/release-notes.tmp"
          mv "$RUNNER_TEMP/release-notes.tmp" "$RUNNER_TEMP/release-notes.md"

      # Pushing a tree that still carries the old version (e.g. a feature
      # commit touching package.json) must not re-release: an existing tag
      # makes every later step a no-op.
      - name: Create the tag if missing
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Annotated tags need a committer identity; the runner has none.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "new=true" >> "$GITHUB_OUTPUT"

      # `--generate-notes` appends GitHub's autogenerated changelog below the
      # changelogen notes (the "What's Changed" section from the release API).
      - name: Create the GitHub release
        if: steps.tag.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --prerelease
          else
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi

      - name: Publish to npm
        if: steps.tag.outputs.new == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi